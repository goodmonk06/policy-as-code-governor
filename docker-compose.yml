version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: policy_db
    environment:
      POSTGRES_USER: policy_user
      POSTGRES_PASSWORD: policy_pass
      POSTGRES_DB: policy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy_user -d policy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policy_backend
    environment:
      DATABASE_URL: postgresql://policy_user:policy_pass@postgres:5432/policy_db
      BACKEND_PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policy_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
